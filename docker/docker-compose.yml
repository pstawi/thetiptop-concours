services:
  postgres:
    image: postgres:16-alpine
    container_name: thetiptop-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thetiptop}
      POSTGRES_USER: ${POSTGRES_USER:-thetiptop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thetiptop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thetiptop} -d ${POSTGRES_DB:-thetiptop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: thetiptop-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: thetiptop-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-thetiptop}
      POSTGRES_USER: ${POSTGRES_USER:-thetiptop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thetiptop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thetiptop} -d ${POSTGRES_DB:-thetiptop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: thetiptop-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  # Console PHP avec pdo_pgsql (utile si l'extension manque sur le PHP hôte / WAMP)
  php:
    build:
      context: ./php
    container_name: thetiptop-php
    working_dir: /app
    volumes:
      - ../api:/app
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-thetiptop}:${POSTGRES_PASSWORD:-thetiptop}@postgres:5432/${POSTGRES_DB:-thetiptop}?serverVersion=16&charset=utf8
      MAILER_DSN: smtp://mailpit:1025
      CORS_ALLOW_ORIGIN: ^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$
      APP_SECRET: change_me_docker_dev_secret
      APP_CONTEST_DEFAULT_STATUS: PREVIEW
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
